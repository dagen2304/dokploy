name: KTC - Build & Deploy

# Se lance quand vous poussez un tag de version (ex : git tag ktc-v0.1.0 && git push origin ktc-v0.1.0)
# ou manuellement depuis l'onglet Actions.
on:
  push:
    tags: ["ktc-v*"]
  workflow_dispatch:
    inputs:
      skip_audit:
        description: "Déployer même si l'audit trouve une faille (urgence uniquement)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # Bloque le déploiement si une dépendance a une faille élevée ou critique
  # qui n'a pas été examinée (exceptions dans pnpm-workspace.yaml).
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit des dépendances
        run: |
          if pnpm audit --audit-level high; then
            exit 0
          fi
          if [ "${{ inputs.skip_audit }}" = "true" ]; then
            echo "::warning::Faille non examinée : déploiement forcé (skip_audit)."
            exit 0
          fi
          echo "::error::Faille élevée ou critique non examinée. Mettez la dépendance à jour, ou ajoutez une exception justifiée dans pnpm-workspace.yaml."
          exit 1

  build-and-deploy:
    needs: audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nom de l'image (GHCR exige des minuscules)
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/dokploy"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="sha-${GITHUB_SHA::7}"; fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fichier d'environnement de production (requis par le Dockerfile)
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déploiement sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Pull first: if the image is unreachable (e.g. private package),
            # stop here instead of leaving the panel without a runnable image.
            docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            docker service update --with-registry-auth \
              --image ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
              dokploy
